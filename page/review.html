<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Unified review</title>
<style>
@font-face{font-family:"NewCM Body";font-weight:400;font-style:normal;src:url(/fonts/NewCM10-Book.woff2) format("woff2")}
@font-face{font-family:"NewCM Body";font-weight:400;font-style:italic;src:url(/fonts/NewCM10-BookItalic.woff2) format("woff2")}
@font-face{font-family:"NewCM Body";font-weight:700;font-style:normal;src:url(/fonts/NewCM10-Bold.woff2) format("woff2")}
@font-face{font-family:"NewCM Title";font-weight:700;src:url(/fonts/NewCMSans10-Bold.woff2) format("woff2")}
:root{--bg:#fbfaf7;--panel:#fff;--ink:#1d1d1b;--muted:#6b6a65;--faint:#9a9890;--line:#e2e0d8;
--crit:#fbe3e1;--crit-ink:#9b2c24;--subs:#faeccc;--subs-ink:#7a4e08;--pol:#e3eefa;--pol-ink:#1d4f86;
--ok:#e2f1df;--ok-ink:#2f6b21;--del:#9a9890;--ins:#2f6b21;--focus:#1d1d1b}
@media (prefers-color-scheme:dark){:root{--bg:#1b1b1a;--panel:#232322;--ink:#ecebe6;--muted:#a9a79f;--faint:#7c7a73;--line:#3a3936;
--crit:#4a2422;--crit-ink:#f2b6b0;--subs:#45371a;--subs-ink:#f0cf86;--pol:#1f3349;--pol-ink:#a9cbf0;
--ok:#233a1f;--ok-ink:#b4dea8;--del:#7c7a73;--ins:#9fd48f;--focus:#ecebe6}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "NewCM Body",Georgia,serif}
h1,h2,h3,.title{font-family:"NewCM Title","Helvetica Neue",Arial,sans-serif;font-weight:700}
button,textarea,input{font:inherit;color:inherit}
select{-webkit-appearance:none;appearance:none;background-color:var(--panel);border:1px solid var(--line);border-radius:6px;padding:3px 30px 3px 9px;font:inherit;font-size:14px;color:inherit;margin-right:10px;cursor:pointer;
background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);
background-position:calc(100% - 15px) 55%,calc(100% - 10px) 55%;background-size:5px 5px,5px 5px;background-repeat:no-repeat}
select:hover{border-color:var(--muted)}
button{background:transparent;border:1px solid var(--line);border-radius:6px;padding:3px 11px;cursor:pointer;font-size:14px}
button:hover{border-color:var(--muted)}
button.on{background:var(--panel);border-color:var(--ink)}
header{position:sticky;top:0;z-index:2;background:var(--bg);border-bottom:1px solid var(--line);padding:10px 24px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.meta{color:var(--muted);font-size:14px}
.spacer{flex:1}
main{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(320px,1fr);gap:24px;padding:16px 24px 80px;max-width:1400px;margin:0 auto}
#draft{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:24px 32px}
#draft p{margin:0 0 .9em;white-space:pre-wrap}
#draft h1{font-size:26px;margin:.2em 0 .6em}#draft h2{font-size:21px;margin:1.2em 0 .5em}#draft h3,#draft h4{font-size:17px;margin:1em 0 .4em}
#draft table{border-collapse:collapse;width:100%;font-size:14px;margin:0 0 1em}
#draft th,#draft td{border-bottom:1px solid var(--line);padding:5px 8px;text-align:left;vertical-align:top}
#draft th{font-family:"NewCM Title","Helvetica Neue",Arial,sans-serif}
#draft a{color:inherit;text-decoration:underline;text-decoration-color:var(--faint)}
#draft .fm{color:var(--faint);font-size:13px;white-space:pre-wrap;font-family:ui-monospace,Menlo,monospace;margin-bottom:1em}
.hl{border-radius:3px;cursor:pointer;padding:1px 0}
.hl.Critical{background:var(--crit)}.hl.Substantive{background:var(--subs)}.hl.Polish{background:var(--pol)}
.hl.declined{background:transparent;border-bottom:1px dotted var(--faint)}
.hl.sel{outline:2px solid var(--focus);outline-offset:1px}
#side{position:sticky;top:110px;align-self:start;display:flex;flex-direction:column;gap:12px;max-height:calc(100vh - 126px);overflow-y:auto;padding-bottom:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px 18px}
.sev{font-size:13px}.sev.Critical{color:var(--crit-ink)}.sev.Substantive{color:var(--subs-ink)}.sev.Polish{color:var(--pol-ink)}
.card .title{font-size:18px;margin:4px 0 8px;line-height:1.3}
.point{color:var(--muted);margin:0 0 12px}
.diff{background:var(--bg);border-radius:8px;padding:10px 12px;margin:0 0 12px;white-space:pre-wrap}
del{color:var(--del);text-decoration:line-through}ins{color:var(--ins);text-decoration:none}
.votes{font-size:14px;color:var(--muted);margin-bottom:12px}.votes b{color:var(--ink);font-weight:700}
.status{font-size:14px;margin-top:10px}.status.accepted{color:var(--ok-ink)}.status.declined{color:var(--muted)}
.reason{font-size:14px;color:var(--subs-ink);margin:0 0 10px}
textarea.blockedit{font:inherit;line-height:1.55;min-height:80px}
textarea{width:100%;min-height:110px;border:1px solid var(--line);border-radius:8px;padding:8px;background:var(--bg)}
input.note{width:100%;border:1px solid var(--line);border-radius:6px;padding:4px 8px;background:var(--bg);margin:8px 0}
.overview{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 14px;font-size:15px}
.banner{border-color:var(--subs-ink)}
.menu{position:absolute;top:30px;right:0;z-index:5;max-height:75vh;overflow-y:auto;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 0;min-width:280px;font-size:14px;box-shadow:0 6px 20px rgba(0,0,0,.18)}
.menu .mi{padding:4px 14px;display:flex;gap:8px;align-items:center;cursor:pointer;white-space:nowrap;position:relative}
.menu .mi:hover{background:var(--bg)}
.menu .sep{border-top:1px solid var(--line);margin:5px 0}
.menu .sub>.menu{display:none;position:absolute;top:-7px;right:100%;max-height:70vh;overflow-y:auto}
.menu .sub:hover>.menu{display:block}
.hl.flash{animation:flash 1.2s ease-out}
@keyframes flash{0%{box-shadow:0 0 0 4px var(--focus)}100%{box-shadow:0 0 0 0 transparent}}
#card{cursor:pointer}
.menu .arrow{margin-left:auto;color:var(--faint)}
.overview a{cursor:pointer;text-decoration:underline;text-decoration-color:var(--faint)}
.list{font-size:14px}
.list .listhead{cursor:default;color:var(--ink);padding:0 0 6px;margin-bottom:4px;border-bottom:1px solid var(--line)}
.list .listhead .title{font-size:15px}.list div{padding:3px 0;cursor:pointer;color:var(--muted)}.list div.cur{color:var(--ink)}
.err{color:var(--crit-ink);font-size:14px;margin-top:8px}
.qa{border-top:1px solid var(--line);margin-top:14px;padding-top:10px}
.q{font-size:14px;margin-bottom:8px}.ans{margin:0 0 12px;font-size:15px}.who{font-size:13px;color:var(--muted)}
.ans button{margin-top:6px}
kbd{font-family:ui-monospace,Menlo,monospace;font-size:12px;border:1px solid var(--line);border-radius:4px;padding:0 4px}
@media (max-width:900px){main{grid-template-columns:1fr}#side{position:static}}
</style>
</head>
<body>
<header>
  <div class="row">
    <h1 id="name" style="font-size:20px;margin:0">Unified review</h1>
    <span class="meta" id="meta" style="flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis"></span>
    <span style="position:relative"><button id="panelbtn" title="Models used for Update and Ask"></button><div id="panelmenu" class="menu" hidden></div></span>
    <span class="meta" id="tally"></span>
    <button id="update" title="Run a new review of the current text">Update</button>
  </div>
  <div class="row meta" id="fail" style="margin-top:4px"></div>
  <div class="row" style="margin-top:8px">
    <label class="meta">Type <select id="f-kind"></select></label>
    <label class="meta">Severity <select id="f-sev"></select></label>
    <label class="meta">Agreement <select id="f-tag"></select></label>
    <label class="meta">Status <select id="f-status"></select></label>
    <span class="spacer"></span>
    <button id="askbtn" title="Ask the panel about the whole draft">Ask</button>
    <button id="acceptall">Accept all shown</button>
  </div>
</header>
<main>
  <div><div id="overview"></div><article id="draft"></article></div>
  <aside id="side"><div id="askpanel"></div><div class="card" id="card"></div><div class="card" id="typos" hidden></div><div class="card list" id="list"></div>
    <div class="meta" style="font-size:13px"><kbd>j</kbd> <kbd>k</kbd> next and previous · <kbd>a</kbd> accept · <kbd>e</kbd> edit · <kbd>d</kbd> decline · <kbd>q</kbd> ask · double-click a paragraph to edit it, <kbd>⌘</kbd><kbd>Enter</kbd> saves</div></aside>
</main>
<script>
const SEV = ["Critical", "Substantive", "Polish"];
const TAGS = ["Unanimous", "Majority", "Contested"];
const KINDS = ["Logic", "Evidence", "Clarity", "Style"];
let S = null, cur = null, filt = {kind: "All", sev: "All", tag: "All", status: "Open"}, mode = null, lastRun = null;
let commentOpen = false;
let logicAuto = null;  // the logic-first view, set when a review loads and lifted when no logic finding is open

const esc = t => (t || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
const inline = t => esc(t).replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>").replace(/`([^`]+)`/g, "<code>$1</code>");
function diffHtml(body) {
  const paras = body.split("\n\n").slice(1).filter(p => p.includes("~~") || p.includes("🟢"));
  return esc(paras.join("\n\n"))
    .replace(/\*\*~~([\s\S]+?)~~\*\*|~~([\s\S]+?)~~/g, (m, a, b) => "<del>" + (a || b) + "</del>")
    .replace(/\*\*🟢\s*([\s\S]+?)\*\*|🟢\s*\*\*([\s\S]+?)\*\*/g, (m, a, b) => "<ins>" + (a || b) + "</ins>");
}
const kindOf = f => f.kind ? f.kind[0].toUpperCase() + f.kind.slice(1) : "";
const shown = f => f.severity !== "Typo" && (filt.kind === "All" || kindOf(f) === filt.kind) && (filt.sev === "All" || f.severity === filt.sev) && (filt.tag === "All" || f.tag === filt.tag)
  && (filt.status === "All" || (filt.status === "Open" ? !f.status : !!f.status));

async function api(route, body) {
  const r = await fetch(route, body ? {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body)} : {});
  const j = await r.json();
  if (!r.ok) throw new Error(j.error || r.statusText);
  return j;
}

function chips(id, key, opts, allLabel) {
  const el = document.getElementById(id);
  el.innerHTML = [[allLabel, "All"], ...opts.map(o => [o, o])]
    .map(([label, v]) => `<option value="${v}"${filt[key] === v ? " selected" : ""}>${label}</option>`).join("");
  el.onchange = () => { filt[key] = el.value; if (key === "kind") logicAuto = false; render(); };
}

function renderDraft() {
  const text = S.text, marks = new Array(text.length).fill(null);
  const order = f => SEV.indexOf(f.severity) * 1000 + f.n;
  for (const f of S.findings) {
    if (!f.span || f.status === "accepted" || !shown(f)) continue;
    const [ms, me] = f.mark || f.span;  // the words the change touches, else the whole passage
    for (let i = ms; i < me; i++) if (!marks[i] || order(f) < order(marks[i])) marks[i] = f;
  }
  const segs = (i, b) => {
    let out = "";
    while (i < b) {
      const f = marks[i]; let j = i;
      while (j < b && marks[j] === f) j++;
      const seg = esc(text.slice(i, j));
      out += f ? `<span class="hl ${f.status === "declined" ? "declined" : f.severity}${cur === f.n ? " sel" : ""}" data-n="${f.n}">${seg}</span>` : seg;
      i = j;
    }
    return out;
  };
  const links = h => h.replace(/\[([^\]<@][^\]<]*)\]\((https?:\/\/[^)<\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  let html = "", pos = 0;
  const fm = text.match(/^---\n[\s\S]*?\n---\n/);
  if (fm) pos = fm[0].length;  // front matter stays in the file, not on the page
  const re = /\n\s*\n/g; let m, start = pos;
  const blocks = [];
  re.lastIndex = pos;
  while ((m = re.exec(text))) { blocks.push([start, m.index]); start = m.index + m[0].length; }
  blocks.push([start, text.length]);
  for (let [a, b] of blocks) {
    while (a < b && text[a] === "\n") a++;
    if (a >= b) continue;
    const raw = text.slice(a, b), h = raw.match(/^(#{1,4}) /);
    if (/^(\s*<[^>]+>\s*)+$/.test(raw)) continue;  // HTML-only lines, such as a table anchor
    if (/^\s*\|/.test(raw) && raw.split("\n").filter(l => l.trim()).every(l => /^\s*\|/.test(l))) {
      let rows = "", off = a, first = true;
      for (const line of raw.split("\n")) {
        const ls = off; off += line.length + 1;
        if (!line.trim() || /^\s*\|[\s:|-]+\|\s*$/.test(line)) continue;  // blank, or the |---| separator
        const bars = [...line.matchAll(/\|/g)].map(m => ls + m.index);
        let cells = "";
        for (let c = 0; c + 1 < bars.length; c++) cells += (first ? "<th>" : "<td>") + segs(bars[c] + 1, bars[c + 1]) + (first ? "</th>" : "</td>");
        rows += `<tr>${cells}</tr>`; first = false;
      }
      html += `<table data-a="${a}" data-b="${b}" title="Double-click to edit">${links(rows)}</table>`;
      continue;
    }
    let inner = "", i = a;
    if (h) i += h[0].length;
    while (i < b) {
      const f = marks[i]; let j = i;
      while (j < b && marks[j] === f) j++;
      const seg = esc(text.slice(i, j));
      inner += f ? `<span class="hl ${f.status === "declined" ? "declined" : f.severity}${cur === f.n ? " sel" : ""}" data-n="${f.n}">${seg}</span>` : seg;
      i = j;
    }
    const at = ` data-a="${a}" data-b="${b}" title="Double-click to edit"`;
    html += h ? `<h${h[1].length}${at}>${links(inner)}</h${h[1].length}>` : `<p${at}>${links(inner)}</p>`;
  }
  const d = document.getElementById("draft");
  d.innerHTML = html;
  d.querySelectorAll(".hl").forEach(e => e.onclick = () => select(+e.dataset.n, false));
  d.querySelectorAll("[data-a]").forEach(e => e.ondblclick = () => editBlock(e));
}

function editBlock(el) {
  const a = +el.dataset.a, b = +el.dataset.b, old = S.text.slice(a, b);
  const box = document.createElement("div");
  box.innerHTML = `<textarea class="blockedit">${esc(old)}</textarea>
    <div class="row" style="margin:6px 0 14px"><button class="bsave">Save</button><button class="bcancel">Cancel</button>
    <span class="meta">Edits the Markdown of this paragraph · Esc cancels</span><span class="err berr"></span></div>`;
  el.replaceWith(box);
  const ta = box.querySelector("textarea");
  ta.style.height = Math.max(80, ta.scrollHeight + 4) + "px";
  ta.focus();
  const cancel = () => renderDraft();
  const save = async () => {
    try { await api("/api/edit", {old, new: ta.value, start: a}); await load(); }
    catch (e) { box.querySelector(".berr").textContent = e.message; }
  };
  box.querySelector(".bsave").onclick = save;
  box.querySelector(".bcancel").onclick = cancel;
  ta.onkeydown = e => { if (e.key === "Escape") cancel(); if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) save(); };
}

function renderCard() {
  const el = document.getElementById("card"), f = S.findings.find(x => x.n === cur);
  if (!f) { el.innerHTML = '<div class="meta">No findings match these filters.</div>'; return; }
  const votes = f.votes.map(v => (v.raised ? `<b>${v.model}</b>` : v.model) + " " + ({agree: "✓", partial: "~", disagree: "✗"}[v.vote] || "?")).join(" · ");
  let actions = "";
  if (!f.status) {
    if (mode === "edit") actions = `<textarea id="edtext">${esc(f.new || "")}</textarea><div class="row" style="margin-top:8px"><button id="save">Apply edited text</button><button id="cancel">Cancel</button></div>`;
    else if (mode === "ask") actions = `<textarea id="qtext" placeholder="Why this change? Would this alternative work?" style="min-height:70px"></textarea><div class="row" style="margin-top:8px"><button id="send">Ask all panelists</button><button id="cancel">Cancel</button><span class="meta">⌘Enter sends</span></div>`;
    else if (mode === "decline") actions = `<input class="note" id="note" placeholder="Reason, optional"><div class="row"><button id="savedecl">Decline</button><button id="cancel">Cancel</button></div>`;
    else actions = (f.applicable ? `<button id="acc">Accept</button> <button id="edt">Edit</button> ` : "") + `<button id="dec">Decline</button> <button id="ask">Ask</button>` + (f.applicable ? "" : ` <button id="copy">Copy for agent</button>`);
  }
  el.innerHTML = `<div class="sev ${f.severity}">${f.n}. ${f.severity}${f.kind ? " · " + kindOf(f) : ""} · ${esc(f.section)} · ${f.tag}</div>
    <div class="title">${esc(f.title)}</div><p class="point">${inline(f.point)}</p>
    ${f.body.includes("~~") || f.body.includes("🟢") ? `<div class="diff">${diffHtml(f.body)}</div>` : ""}
    <div class="votes">${votes}</div>
    ${!f.status && !f.applicable ? `<p class="reason">Cannot apply here: ${esc(f.reason || "it is about the whole draft")}.</p>` : ""}
    <div class="row">${actions}</div>
    ${f.status ? `<div class="status ${f.status}">${f.status === "accepted" ? "Accepted and written to the file" : "Declined" + (f.note ? ": " + esc(f.note) : "")}</div>` : ""}
    ${thread(f)}
    <div class="err" id="err"></div>`;
  const on = (id, fn) => { const b = document.getElementById(id); if (b) b.onclick = fn; };
  on("acc", () => act("/api/accept", {n: f.n}));
  on("edt", () => { mode = "edit"; renderCard(); document.getElementById("edtext").focus(); });
  on("dec", () => { mode = "decline"; renderCard(); document.getElementById("note").focus(); });
  on("save", () => act("/api/accept", {n: f.n, text: document.getElementById("edtext").value}));
  on("savedecl", () => act("/api/decline", {n: f.n, note: document.getElementById("note").value}));
  on("cancel", () => { mode = null; renderCard(); });
  on("ask", () => { mode = "ask"; renderCard(); document.getElementById("qtext").focus(); });
  const sendQ = async () => {
    const q = document.getElementById("qtext").value.trim();
    if (!q) { document.getElementById("err").textContent = "Type a question first."; return; }
    try { await api("/api/ask", {n: f.n, question: q}); mode = null; await load(); }
    catch (e) { document.getElementById("err").textContent = e.message; }
  };
  on("send", sendQ);
  const qt = document.getElementById("qtext");
  if (qt) qt.onkeydown = e => { if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) sendQ(); if (e.key === "Escape") { mode = null; renderCard(); } };
  document.querySelectorAll(".accrev").forEach(b => b.onclick = () => {
    const a = f.questions[+b.dataset.q].answers[b.dataset.m];
    act("/api/accept", {n: f.n, old: a.old, text: a.new, note: "revised by " + a.model + " after a question"});
  });
  on("copy", () => { navigator.clipboard.writeText(`Address finding ${f.n} from the unified review of ${S.file} (run ${S.run}).`); document.getElementById("err").textContent = "Copied. Paste it to an agent."; });
}

function revHtml(a) {
  const words = (s) => s.split(/(\s+)/);
  const o = words(a.old), n = words(a.new);
  let i = 0; while (i < o.length && i < n.length && o[i] === n[i]) i++;
  let j = 0; while (j < o.length - i && j < n.length - i && o[o.length - 1 - j] === n[n.length - 1 - j]) j++;
  return esc(o.slice(0, i).join("")) + (o.length - i - j > 0 ? "<del>" + esc(o.slice(i, o.length - j).join("")) + "</del> " : "")
    + (n.length - i - j > 0 ? "<ins>" + esc(n.slice(i, n.length - j).join("")) + "</ins>" : "") + esc(o.slice(o.length - j).join(""));
}

function thread(f) {
  if (!f.questions || !f.questions.length) return "";
  return f.questions.map((q, k) => `<div class="qa"><div class="q">You asked: ${esc(q.question)}</div>` +
    Object.entries(q.answers).map(([m, a]) => `<div class="ans"><div class="who">${esc(a.model)}${a.raised ? " (raised it)" : ""}${a.seconds ? ` · ${a.seconds} s` : ""}</div>` +
      (a.status === "pending" ? `<div class="meta">Thinking…</div>` : a.status === "failed" ? `<div class="err">No answer: ${esc(a.reason || "the model call failed")}</div>` :
        `<div>${inline(a.text)}</div>` + (a.old ? `<div class="diff" style="margin-top:6px">${revHtml(a)}</div>` +
          (a.applied ? `<div class="status accepted">Applied</div>` : f.status ? "" : a.applicable ? `<button class="accrev" data-q="${k}" data-m="${m}">Accept this version</button>` : `<div class="reason">This version edits text that is not in the draft now (often the panel's proposal rather than your text), so it cannot be applied.</div>`) : "")) +
      `</div>`).join("") + `</div>`).join("");
}

function commentThreads() {
  return (S.comments || []).map((c, k) => `<div class="qa"><div class="q">You: ${esc(c.comment)}${c.focus ? " <span class='meta'>(focus for the next Update)</span>" : ""}</div>` +
    Object.entries(c.answers).map(([m, a]) => `<div class="ans"><div class="who">${esc(a.model || m)}${a.seconds ? ` · ${a.seconds} s` : ""}</div>` +
      (a.status === "pending" ? `<div class="meta">Thinking…</div>` : a.status === "failed" ? `<div class="err">No answer: ${esc(a.reason || "the model call failed")}</div>` :
        `<div>${inline(a.text)}</div>` + (a.changes || []).map((ch, i) => `<div class="diff" style="margin-top:6px">${revHtml(ch)}</div>` +
          (ch.applied ? `<div class="status accepted">Applied</div>` : ch.applicable ? `<button class="acccha" data-c="${k}" data-m="${m}" data-i="${i}">Accept this change</button>` : `<div class="reason">This change does not match the current text.</div>`)).join("")) +
      `</div>`).join("") + `</div>`).join("");
}

function renderTypos() {
  // Typos are listed together, all checked, and accepted in one step instead of one by one in the draft.
  const el = document.getElementById("typos"), ty = S.findings.filter(f => f.severity === "Typo" && !f.status && f.applicable);
  el.hidden = !ty.length;
  if (!ty.length) return;
  el.innerHTML = `<div class="listhead"><span class="title">Typos</span> <span class="meta">${ty.length} one-word fixes no other voter disputed · uncheck any to keep</span></div>` +
    ty.map(f => `<label style="display:flex;gap:8px;align-items:baseline;margin:4px 0;font-size:14px"><input type="checkbox" checked data-n="${f.n}"><span>${f.n}. ${diffHtml(f.body)} <span class="meta">${esc(f.section)}</span></span></label>`).join("") +
    `<div class="row" style="margin-top:6px"><button id="acctypos">Accept checked</button><span class="err" id="typoerr"></span></div>`;
  document.getElementById("acctypos").onclick = async () => {
    const ns = [...el.querySelectorAll("input:checked")].map(x => +x.dataset.n);
    for (const n of ns) { try { await api("/api/accept", {n}); } catch (e) { document.getElementById("typoerr").textContent = e.message; } }
    load();
  };
}

function renderSide() {
  renderTypos();
  const el = document.getElementById("list"), fs = S.findings.filter(shown);
  el.innerHTML = `<div class="listhead"><span class="title">Findings</span> <span class="meta">${fs.length} shown by the filters above · click one to jump to it</span></div>` +
    fs.map(f => `<div data-n="${f.n}" class="${f.n === cur ? "cur" : ""}">${f.n}. <span class="sev ${f.severity}">${f.severity}</span>${f.kind ? " · " + kindOf(f) : ""} · ${esc(f.title)}${f.status ? " · " + f.status : ""}</div>`).join("");
  el.querySelectorAll("div[data-n]").forEach(e => e.onclick = () => select(+e.dataset.n, true));
  const ov = S.findings.filter(f => shown(f) && !f.span);
  const openLogic = S.findings.filter(f => f.kind === "logic" && !f.status).length;
  const untyped = S.findings.length && S.findings.every(f => !f.kind);
  const banner = untyped ? `<div class="overview banner" style="margin-bottom:12px">This review has no type labels, so it cannot show logic findings first. Click Update for a new review that has them.</div>`
    : logicAuto ? `<div class="overview banner" style="margin-bottom:12px">Logic first: ${openLogic} logic finding${openLogic === 1 ? "" : "s"} open. Other findings are hidden until these are done, since a passage whose argument fails may be rewritten anyway. <a id="showall">Show everything now</a></div>` : "";
  const box = document.getElementById("commentbox");
  const keep = box ? {text: box.querySelector("textarea").value, focus: box.querySelector("input").checked, active: document.activeElement === box.querySelector("textarea")} : null;
  document.getElementById("overview").innerHTML = banner +
    (ov.length ? `<div class="overview" style="margin-bottom:12px">Whole draft: ${ov.map(f => `<a data-n="${f.n}">${f.n}. ${esc(f.title)}</a>`).join(" · ")}</div>` : "");
  document.getElementById("askpanel").innerHTML = (!commentOpen ? "" :
    `<div class="card" id="commentbox"><div class="row" style="margin-bottom:6px"><span class="title" style="font-size:15px">Ask about the whole draft</span><span class="spacer"></span><a id="closecomment" class="meta" style="cursor:pointer">Close</a></div><div class="meta" style="font-size:13px;margin-bottom:6px">Goes to ${S.chosen.map(c => c.label).join(", ")}</div>
      <textarea placeholder="A question, a comment, or a request: Is the hypothesis falsifiable as written? Tighten the wedge section." style="min-height:60px"></textarea>
      <div class="row" style="margin-top:6px"><button id="sendc">Ask all panelists</button>
      <label class="meta"><input type="checkbox"> Use as focus for the next Update</label><span class="err" id="cerr"></span></div>
      ${commentThreads()}</div>`);
  const oc = document.getElementById("opencomment");
  if (oc) oc.onclick = () => { commentOpen = true; renderSide(); document.querySelector("#commentbox textarea").focus(); };
  const cc = document.getElementById("closecomment");
  if (cc) cc.onclick = () => { commentOpen = false; renderSide(); };
  const nb = document.getElementById("commentbox");
  document.querySelectorAll("#overview a[data-n]").forEach(e => e.onclick = () => select(+e.dataset.n, false));
  const sa0 = document.getElementById("showall"); if (sa0) sa0.onclick = () => { logicAuto = false; filt.kind = "All"; render(); };
  if (!nb) return;
  if (keep) { nb.querySelector("textarea").value = keep.text; nb.querySelector("input").checked = keep.focus; if (keep.active) nb.querySelector("textarea").focus(); }
  document.querySelectorAll("#overview a[data-n]").forEach(e => e.onclick = () => select(+e.dataset.n, false));
  const sa = document.getElementById("showall"); if (sa) sa.onclick = () => { logicAuto = false; filt.kind = "All"; render(); };
  const sendC = async () => {
    const t = nb.querySelector("textarea").value.trim();
    if (!t) { document.getElementById("cerr").textContent = "Type a comment first."; return; }
    try { await api("/api/comment", {text: t, focus: nb.querySelector("input").checked}); nb.querySelector("textarea").value = ""; await load(); }
    catch (e) { document.getElementById("cerr").textContent = e.message; }
  };
  document.getElementById("sendc").onclick = sendC;
  nb.querySelector("textarea").onkeydown = e => { if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) sendC(); };
  nb.querySelectorAll(".acccha").forEach(b => b.onclick = async () => {
    const ch = S.comments[+b.dataset.c].answers[b.dataset.m].changes[+b.dataset.i];
    try { await api("/api/change", {old: ch.old, new: ch.new}); await load(); }
    catch (e) { document.getElementById("cerr").textContent = e.message; }
  });
}

function render() {
  document.getElementById("name").textContent = S.name;
  document.getElementById("meta").textContent = `Reviewed ${S.started}${S.edited ? " · edited since" : ""} by ${S.panel.join(", ")}`;
  document.getElementById("panelbtn").textContent = `Panel: ${S.chosen.map(c => c.label).join(", ")} ▾`;
  document.getElementById("fail").textContent = S.failures.length ? "Failed: " + S.failures.map(x => `${x.model} ${x.stage} (${x.reason})`).join("; ") : "";
  const acc = S.findings.filter(f => f.status === "accepted").length, dec = S.findings.filter(f => f.status === "declined").length;
  document.getElementById("tally").textContent = `${acc} accepted · ${dec} declined · ${S.findings.length - acc - dec} open`;
  const job = S.job && S.job.running;
  const up = document.getElementById("update"); up.textContent = job ? "Reviewing…" : "Update"; up.disabled = !!job;
  const openLogic = S.findings.filter(f => f.kind === "logic" && !f.status).length;
  if (logicAuto === null) { logicAuto = openLogic > 0; if (logicAuto) filt.kind = "Logic"; }
  if (logicAuto && !openLogic) { logicAuto = false; filt.kind = "All"; }
  chips("f-kind", "kind", KINDS, "All"); chips("f-sev", "sev", SEV, "All");
  chips("f-tag", "tag", TAGS, "Any");
  const st = document.getElementById("f-status");
  st.innerHTML = ["Open", "Done", "All"].map(o => `<option${filt.status === o ? " selected" : ""}>${o}</option>`).join("");
  st.onchange = () => { filt.status = st.value; render(); };
  const vis = S.findings.filter(shown);
  if (!vis.some(f => f.n === cur)) cur = vis.length ? vis[0].n : null;
  renderDraft(); renderCard(); renderSide();
}

function select(n, scroll) {
  cur = n; mode = null; render();
  const e = document.querySelector(`.hl[data-n="${n}"]`);
  if (scroll && e) centerOn(e);
}

let polling = false;
async function load() {
  S = await api("/api/state");
  if (lastRun && S.run !== lastRun) { cur = null; logicAuto = null; filt.kind = "All"; }
  lastRun = S.run;
  if (mode) { renderSide(); } else render();
  const pending = S.findings.some(f => (f.questions || []).some(q => Object.values(q.answers).some(a => a.status === "pending")))
    || (S.comments || []).some(c => Object.values(c.answers).some(a => a.status === "pending"));
  if ((S.comments || []).some(c => Object.values(c.answers).some(a => a.status === "pending"))) commentOpen = true;
  if ((S.job && S.job.running) || pending) { if (!polling) { polling = true; setTimeout(() => { polling = false; load(); }, pending ? 2000 : 3000); } }
}

async function act(route, body) {
  try {
    await api(route, body);
    const next = S.findings.filter(shown).find(f => f.n > body.n && !f.status);
    mode = null; await load();
    if (next) select(next.n, true);
  } catch (e) { document.getElementById("err").textContent = e.message; }
}

let MODELS = null, openKeys = new Set();
async function savePanel(list) { await api("/api/panel", {panel: list}); await load(); drawPanelMenu(); }
function drawPanelMenu() {
  const el = document.getElementById("panelmenu"), chosen = S.chosen.map(c => c.spec);
  const add = !MODELS ? `<div class="mi meta">Loading models…</div>` :
    `<div class="mi meta" style="cursor:default">Add a model</div>` + MODELS.map((l, li) =>
      `<div class="mi tog" data-k="L${li}" style="padding-left:14px">${openKeys.has("L" + li) ? "▾" : "▸"} ${esc(l.lab)}</div>` +
      (!openKeys.has("L" + li) ? "" : l.families.map((f, fi) =>
        `<div class="mi tog" data-k="L${li}F${fi}" style="padding-left:28px">${openKeys.has("L" + li + "F" + fi) ? "▾" : "▸"} ${esc(f.family)}</div>` +
        (!openKeys.has("L" + li + "F" + fi) ? "" : f.items.map(i =>
          `<div class="mi pick" data-spec="${esc(i.spec)}" style="padding-left:46px">${chosen.includes(i.spec) ? "✓ " : ""}${esc(i.label)}</div>`).join(""))).join(""))).join("");
  el.innerHTML = `<div class="mi meta" style="cursor:default">Used for Update and Ask</div>` +
    S.chosen.map(c => `<div class="mi">${esc(c.label)}<span class="arrow rm" data-spec="${esc(c.spec)}" title="Remove">✕</span></div>`).join("") +
    `<div class="sep"></div>${add}<div class="mi" id="resetpanel">Reset to default</div>`;
  el.querySelectorAll(".tog").forEach(x => x.onclick = e => { e.stopPropagation(); const k = x.dataset.k;
    openKeys.has(k) ? openKeys.delete(k) : openKeys.add(k); drawPanelMenu(); });
  el.querySelectorAll(".rm").forEach(x => x.onclick = e => { e.stopPropagation(); savePanel(chosen.filter(s => s !== x.dataset.spec)); });
  el.querySelectorAll(".pick").forEach(x => x.onclick = e => { e.stopPropagation(); const sp = x.dataset.spec;
    savePanel(chosen.includes(sp) ? chosen.filter(s => s !== sp) : [...chosen, sp]); });
  document.getElementById("resetpanel").onclick = e => { e.stopPropagation(); savePanel([]); };
}
document.getElementById("panelbtn").onclick = async e => {
  e.stopPropagation();
  const el = document.getElementById("panelmenu");
  el.hidden = !el.hidden;
  if (!el.hidden) {  // drop down inside the right column, below the header
    const side = document.getElementById("side").getBoundingClientRect(), head = document.querySelector("header").getBoundingClientRect();
    Object.assign(el.style, {position: "fixed", left: side.left + "px", width: side.width + "px", right: "auto", top: head.bottom + 4 + "px"});
    drawPanelMenu(); if (!MODELS) { MODELS = await api("/api/models"); drawPanelMenu(); } }
};
document.addEventListener("click", e => { const el = document.getElementById("panelmenu"); if (!el.contains(e.target)) el.hidden = true; });
function centerOn(el) {
  const y = el.getBoundingClientRect().top + window.scrollY - window.innerHeight / 2 + el.offsetHeight / 2;
  window.scrollTo({top: Math.max(0, y)});
}
function goTo(n) {
  const e = document.querySelector(`.hl[data-n="${n}"]`);
  if (!e) return;
  centerOn(e);
  e.classList.remove("flash"); void e.offsetWidth; e.classList.add("flash");
}
document.getElementById("card").addEventListener("click", e => {
  if (e.target.closest("button, textarea, input, a, select")) return;
  if (cur != null) goTo(cur);
});
document.getElementById("askbtn").onclick = () => { commentOpen = !commentOpen; renderSide(); const t = document.querySelector("#commentbox textarea"); if (t) { document.getElementById("side").scrollTop = 0; t.focus(); } };
document.getElementById("update").onclick = async () => { await api("/api/update", {}); load(); };
document.getElementById("acceptall").onclick = async () => {
  const todo = S.findings.filter(f => shown(f) && !f.status && f.applicable);
  if (!todo.length) return;
  if (!confirm(`Apply ${todo.length} change${todo.length > 1 ? "s" : ""} to ${S.name}?`)) return;
  for (const f of todo) { try { await api("/api/accept", {n: f.n}); } catch (e) {} }
  load();
};
document.addEventListener("keydown", e => {
  if (["TEXTAREA", "INPUT"].includes(e.target.tagName) || !S) return;
  const vis = S.findings.filter(shown), i = vis.findIndex(f => f.n === cur);
  const f = vis[i];
  if (e.key === "j" && i < vis.length - 1) select(vis[i + 1].n, true);
  else if (e.key === "k" && i > 0) select(vis[i - 1].n, true);
  else if (e.key === "a" && f && !f.status && f.applicable) act("/api/accept", {n: f.n});
  else if (e.key === "e" && f && !f.status && f.applicable) { mode = "edit"; renderCard(); }
  else if (e.key === "d" && f && !f.status) { mode = "decline"; renderCard(); }
  else if (e.key === "q" && f && !f.status) { e.preventDefault(); mode = "ask"; renderCard(); document.getElementById("qtext").focus(); }
});
load().catch(e => { document.getElementById("draft").textContent = "Could not load the review: " + e.message; });
</script>
</body>
</html>
