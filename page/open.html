<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Open a file</title>
<style>
@font-face{font-family:"NewCM Body";font-weight:400;font-style:normal;src:url(/fonts/NewCM10-Book.woff2) format("woff2")}
@font-face{font-family:"NewCM Title";font-weight:700;src:url(/fonts/NewCMSans10-Bold.woff2) format("woff2")}
:root{--bg:#fbfaf7;--panel:#fff;--ink:#1d1d1b;--muted:#6b6a65;--line:#e2e0d8;--crit-ink:#9b2c24}
@media (prefers-color-scheme:dark){:root{--bg:#1b1b1a;--panel:#232322;--ink:#ecebe6;--muted:#a9a79f;--line:#3a3936;--crit-ink:#f2b6b0}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "NewCM Body",Georgia,serif}
h1{font-family:"NewCM Title","Helvetica Neue",Arial,sans-serif;font-weight:700;font-size:20px;margin:0 0 8px}
main{max-width:760px;margin:0 auto;padding:32px 16px}
button{font:inherit;color:inherit;background:transparent;border:1px solid var(--line);border-radius:6px;padding:3px 11px;cursor:pointer;font-size:14px}
button:hover{border-color:var(--muted)}
#drop{border:2px dashed var(--line);border-radius:12px;padding:56px 24px;text-align:center;background:var(--panel);margin:16px 0}
#drop.over{border-color:var(--ink)}
#drop p{margin:0 0 8px}
.meta{color:var(--muted);font-size:14px}
.err{color:var(--crit-ink)}
.stages{margin:12px 0;font-size:15px}
.stage{padding:6px 0;border-bottom:1px solid var(--line)}
.stage.running>b{color:var(--ink)}.stage.done>b,.stage.done .models{color:var(--muted)}.stage .failed{color:var(--crit-ink)}
.models{display:flex;flex-wrap:wrap;gap:4px 18px;margin:2px 0 0 20px;font-size:14px}
pre{white-space:pre-wrap;font:13px/1.45 ui-monospace,Menlo,monospace;color:var(--muted);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
</style>
</head>
<body>
<main>
  <h1 id="title">Open a file</h1>
  <div id="pick">
    <div id="drop">
      <p>Drop a draft here from Finder</p>
      <div class="meta">PDF, Word, Markdown, text, or TeX. The review edits a Markdown file in place, and a PDF or Word file as a Markdown copy.</div>
    </div>
    <button id="finder">Choose in Finder…</button>
  </div>
  <div class="meta" id="note" style="margin-top:12px"></div>
  <div id="progress"></div>
  <details id="logbox" hidden><summary class="meta">Log</summary><pre id="log"></pre></details>
</main>
<script>
// A browser gives a dropped file's contents but not its path. The server finds
// the original with Spotlight (same name, same bytes) and reviews it in place.
// If it cannot find exactly one, it says so, and Choose in Finder still works.
const TYPES = [".pdf", ".docx", ".md", ".txt", ".tex"];
const esc = t => (t || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
const note = html => { document.getElementById("note").innerHTML = html; };
const fail = msg => note(`<span class="err">${esc(msg)}</span>`);
const title = t => { document.getElementById("title").textContent = t; document.title = t; };
let busy = false;
// Progress, read from the review's log: each stage, and each model's state in it.
const clock = s => s < 60 ? `${s} s` : `${Math.floor(s / 60)} m ${String(s % 60).padStart(2, "0")} s`;
function progress(j) {
  const mark = {done: "✓", failed: "✗", running: "…"};
  return `<div class="stages">` + (j.stages || []).map(st => `<div class="stage ${st.state}"><b>${mark[st.state]} ${esc(st.label)}</b>` +
    (st.secs ? ` <span class="meta">${clock(st.secs)}</span>` : "") +
    (st.models.length ? `<div class="models">` + st.models.map(m => `<span class="${m.state}">${mark[m.state]} ${esc(m.name)}` +
      ` <span class="meta">${esc(m.note || (m.state === "running" && st.state === "running" ? "working" : ""))}</span></span>`).join("") + `</div>` : "") +
    `</div>`).join("") + `</div>`;
}

async function post(route, body) {
  const r = await fetch(route, {method: "POST", body});
  const j = await r.json();
  if (!r.ok) throw new Error(j.error);
  return j;
}

async function opened(j) {  // the server's reply for a chosen file
  if (j.cancelled) { busy = false; note(""); return; }
  if (j.page) { location.replace(j.page); return; }
  document.getElementById("pick").hidden = true;
  title(`Reviewing ${j.name}`);
  note("This tab turns into the review page when the review finishes. A long draft takes several minutes.");
  poll(j.id);
}

async function poll(id) {
  let j;
  try { const r = await fetch("/api/job/" + encodeURIComponent(id)); j = await r.json(); if (!r.ok) throw new Error(j.error); }
  catch (e) { fail(e.message); return; }
  document.getElementById("logbox").hidden = !j.log.length;
  document.getElementById("log").textContent = j.log.join("\n");
  document.getElementById("progress").innerHTML = progress(j);
  if (j.running) title(`Reviewing ${j.name} · ${clock(j.elapsed)}`);
  if (j.error) { title(`Review of ${j.name} failed`); fail(j.error); document.getElementById("logbox").open = true; return; }
  if (j.page) { location.replace(j.page); return; }
  setTimeout(poll, 2000, id);
}

async function run(label, f) {
  if (busy) return;
  busy = true; note(esc(label));
  try { await opened(await f()); } catch (e) { busy = false; fail(e.message); }
}

// Opened by a drop on a review page: the review is already running.
const params = new URLSearchParams(location.search);
if (params.get("id")) { busy = true; opened({id: params.get("id"), name: params.get("name") || "the file"}); }

const drop = document.getElementById("drop");
document.addEventListener("dragover", e => { e.preventDefault(); if (!busy) drop.classList.add("over"); });
document.addEventListener("dragleave", e => { if (!e.relatedTarget) drop.classList.remove("over"); });
document.addEventListener("drop", e => {
  e.preventDefault(); drop.classList.remove("over");
  const file = e.dataTransfer.files[0];
  if (!file) return;
  if (!TYPES.some(t => file.name.toLowerCase().endsWith(t))) { fail(`Drop a ${TYPES.join(", ")} file.`); return; }
  run(`Looking for ${file.name} on this Mac…`, async () => post("/api/locate/" + encodeURIComponent(file.name), await file.arrayBuffer()));
});
document.getElementById("finder").onclick = () =>
  run("Pick a draft in the Finder window. It may open behind this browser window.", () => post("/api/open", "{}"));
</script>
</body>
</html>
